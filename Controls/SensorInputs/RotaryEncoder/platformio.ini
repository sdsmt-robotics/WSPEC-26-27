; PlatformIO project for the YUMO E6A2-CS3E rotary encoder on an ESP32-S3.
;
; Build:          pio run
; Upload:         pio run -t upload
; Serial monitor: pio device monitor

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -Wall
    ; Uncomment if the board is plugged in through the ESP32-S3's native
    ; USB port (labelled "USB") instead of the USB-UART bridge ("UART"/"COM"),
    ; so Serial output goes to the native USB CDC port.
    ; -DARDUINO_USB_CDC_ON_BOOT=1
